apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-auth
  namespace: backstage-auth
  labels:
    app: backstage-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-auth
  template:
    metadata:
      labels:
        app: backstage-auth
    spec:
      nodeSelector:
        karpenter.sh/nodepool: spot
      serviceAccountName: backstage
      containers:
      - name: backstage-auth
        image: 226633502530.dkr.ecr.us-east-1.amazonaws.com/backstage-auth:main-3f35442
        ports:
        - name: http
          containerPort: 7007
        # Backstage responde 503 en readiness si su arranque falla, aunque el proceso siga vivo.
        # El endpoint de liveness da 200 en ese estado, por eso las tres probes usan readiness.
        startupProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /.backstage/health/v1/readiness
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: NODE_ENV
          value: production
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: '5432'
        - name: K8S_CLUSTER_URL
          value: https://kubernetes.default.svc
        - name: K8S_CLUSTER_NAME
          value: poc-kafka 
        envFrom:
        - secretRef:
            name: postgres-secrets
        - secretRef:
            name: backstage-secrets
        volumeMounts:
        - name: harness-app-config-local
          mountPath: /app/app-config.local.yaml
          subPath: app-config-local.yaml
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: harness-app-config-local
        configMap:
          name: harness-app-config-local
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U backstage; do
            echo "Waiting for postgres..."
            sleep 2
          done
